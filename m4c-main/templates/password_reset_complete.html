{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Updated | Movement for Change</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body class="page-shell login-shell">
    <main class="login-layout page-width">
      <section class="login-intro">
        <a class="brand login-brand" href="{% url 'home' %}">
          <img src="{% static 'images/m4c-logo.jpeg' %}" alt="Movement for Change logo" width="48" height="48">
          <span class="brand-copy"><strong>M4C</strong><small>Peace Movement</small></span>
        </a>
        <div class="login-intro-copy">
          <p class="eyebrow">Member account</p>
          <h1>You're back with <em>M4C</em></h1>
          <p>Your account password has been updated.</p>
        </div>
        <a class="login-home-link" href="{% url 'home' %}">Return to the public site <span aria-hidden="true">&rarr;</span></a>
      </section>
      <section class="login-panel" aria-labelledby="resetHeading">
        <div class="login-panel-heading">
          <p class="eyebrow">Account recovery</p>
          <h2 id="resetHeading">Password updated</h2>
          <p>You can now sign in with your new password.</p>
        </div>
        <p class="auth-switch"><a href="{% url 'login' %}">Sign in</a></p>
      </section>
    </main>
  </body>
</html>
